apply plugin: "com.android.application"
// Data Binding 仍通过注解处理器生成 BR 和绑定实现，使用兼容 AGP 内置 Kotlin 的 kapt 插件。
apply plugin: 'com.android.legacy-kapt'
apply plugin: 'kotlinx-serialization'

android {
    namespace 'com.drake.net.sample'
    compileSdk 37
    signingConfigs {
        signed {
            storeFile file("../signed")
            storePassword "s73dfyUxkjuq"
            keyAlias "key0"
            keyPassword "s73dfyUxkjuq"
        }
    }
    defaultConfig {
        applicationId "com.drake.net.sample"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        multiDexEnabled true
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.signed
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    buildFeatures {
        buildConfig true
        dataBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    testImplementation "junit:junit:4.13.2"
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "androidx.core:core-ktx:1.17.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation "com.google.android.material:material:1.13.0"
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.7'

    // ------------------------------网络请求-------------------------------------
    implementation project(path: ":net")
    implementation platform("com.squareup.okhttp3:okhttp-bom:$okhttp_version")
    implementation platform("org.jetbrains.kotlinx:kotlinx-coroutines-bom:$coroutine_version")
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version" // 协程基础库
    implementation "com.github.bumptech.glide:glide:4.16.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"
    implementation "com.github.liangjingkanji:BRV:$brv_version" // 提供自动分页/缺省页/自动下拉刷新功能
    implementation "com.github.chuckerteam.chucker:library:4.2.0" // 兼容 API 21 的网络日志版本


    // ------------------------------JSON解析-------------------------------------
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$serialization_version" // JSON序列化库
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-protobuf:$serialization_version" // protobuf序列化
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    implementation "org.jetbrains.kotlin:kotlin-reflect:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.14.0'
    // 官方 Android 5 制品移除仅 API 26 才可执行的 MethodHandle 调用，保持 minSdk 21。
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.65.android5'

    // ------------------------------其他库-------------------------------------
    implementation 'com.github.liangjingkanji:StatusBar:2.0.2' // 透明状态栏
    implementation 'com.github.liangjingkanji:debugkit:1.3.0' // 开发调试窗口工具
    implementation "com.github.liangjingkanji:Tooltip:1.2.2" // 吐司工具
    implementation 'com.github.liangjingkanji:Engine:0.0.74'
    implementation "com.squareup.okhttp3:mockwebserver3:$okhttp_version"
    implementation 'com.github.liangjingkanji:Serialize:3.0.1'
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'
}
