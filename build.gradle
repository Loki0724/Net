// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        // Kotlin、协程与序列化运行库统一升级，避免传递依赖引入不同版本的 Kotlin 元数据。
        kotlin_version = '2.3.21'
        brv_version = '1.5.2'
        coroutine_version = '1.11.0'
        okhttp_version = '5.5.0'
        serialization_version = '1.11.0'
        appcompat_version = '1.7.1'
        lifecycle_version = '2.9.4'
    }

    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        // OkHttp 5.5 的 Android 变体要求 API 37，使用正式支持该 SDK 的 AGP。
        classpath 'com.android.tools.build:gradle:9.3.3'
        classpath 'com.android.tools.build:gradle-kotlin:9.3.3'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        classpath 'org.jetbrains.dokka:dokka-gradle-plugin:2.2.0'
    }
}

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url 'https://jitpack.io' }
    }
}


tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
